name = "ShortTime"
version = "0.1.0"
keywords = ["math", "pde", "parabolic", "differential-geometry"]
defaultTargets = ["ShortTime"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Pinned: every statement in this project is checked against exactly this
# version of the library (and, transitively, Mathlib v4.33.1).
[[require]]
name = "DifferentialGeometry"
git = "https://github.com/qinz1yang/differential-geometry.git"
rev = "v0.1.3"

[[lean_lib]]
name = "ShortTime"
